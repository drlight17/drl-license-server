services:
  license-server:
    #image: drlight17/drl-license-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: license-server
    ports:
      - ${WEB_EXP_GUI_PORT}:80
    env_file:
      - .env
    volumes:
      # Uncomment when Developing to access source code
      - ./src:/var/www/html
      - ./logs:/var/www/logs
      - ./redis_data:/var/lib/redis
      - ./redis_log:/var/log/redis
      # Mount timezone data from host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      # Set timezone from host
      - TZ=${TZ:-UTC}
    restart: unless-stopped

